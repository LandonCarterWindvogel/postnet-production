[build]
  command = "npm run build"
  publish = "dist"

# These are browser-visible settings: use the publishable key only, never service_role.
[build.environment]
  VITE_SUPABASE_URL = "https://kswsazdkvkrxmnjvhrrh.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_o6Lbc49INuhS8503iNX1WQ_xny2q_MM"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
